name: Check Telegram bot
on:
  push:
    branches: [development]
    paths: ['.github/workflows/check-telegram.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify token and private Start messages
        env:
          SEND_SETUP: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Send approved Telegram setup message 739182' && github.run_attempt == 1 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              print("FAIL: TELEGRAM_BOT_TOKEN is missing.")
              sys.exit(1)
          def api(method, payload=None):
              request = urllib.request.Request("https://api.telegram.org/bot" + token + "/" + method, data=json.dumps(payload or {}).encode("utf-8"), headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)
              if not data.get("ok"):
                  raise ValueError("API rejected request")
              return data["result"]
          try:
              me = api("getMe")
              if me.get("username", "").lower() != "revvi_revolis_bot":
                  print("FAIL: Token belongs to a different bot.")
                  sys.exit(1)
              print("PASS: Token accepted for @revvi_revolis_bot.")
              webhook = api("getWebhookInfo")
              if webhook.get("url"):
                  print("STOP: Existing webhook found; it was not changed.")
                  sys.exit(1)
              updates = api("getUpdates")
              chats = {u["message"]["chat"]["id"] for u in updates if u.get("message", {}).get("chat", {}).get("type") == "private" and u["message"].get("text", "").strip() == "/start revolis-739182"}
              print("Private chats matching setup code: " + str(len(chats)))
              if len(chats) != 1:
                  print("FAIL: Expected exactly one matching private chat.")
                  sys.exit(1)
              print("PASS: Personal recipient identified by setup code; recipient not yet saved.")
              if os.environ.get("SEND_SETUP") == "true":
                  chat_id = next(iter(chats))
                  message = ("Revolis.Мото: тестовое сообщение. Подключение к боту работает.\n\n"
                      "Твой идентификатор чата:\n" + str(chat_id) + "\n\n"
                      "Сохрани это число в GitHub: Settings → Secrets and variables → Actions → New repository secret.\n"
                      "Name: TELEGRAM_CHAT_ID\nSecret: число выше\n\n"
                      "https://github.com/8j722ntzch-wq/Revolis.Moto/settings/secrets/actions\n\n"
                      "После сохранения напиши в чате с помощником «Сохранил TELEGRAM_CHAT_ID».\n"
                      "Отправка заявок с сайта пока не подключена.")
                  result = api("sendMessage", {"chat_id": chat_id, "text": message})
                  if result.get("chat", {}).get("id") != chat_id:
                      raise ValueError("Unexpected recipient")
                  print("PASS: Telegram accepted the approved setup message for the verified private chat.")
              print("No token, chat IDs or message contents logged; no updates acknowledged.")
          except Exception:
              print("FAIL: Telegram verification failed. Details suppressed to protect token.")
              sys.exit(1)
          PY
