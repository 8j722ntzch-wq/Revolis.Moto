name: Check Telegram bot (read only)
on:
  push:
    branches: [development]
    paths: ['.github/workflows/check-telegram.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify replacement bot identity (no messages)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              print("FAIL: TELEGRAM_BOT_TOKEN is missing.")
              sys.exit(1)
          def api(method):
              request = urllib.request.Request("https://api.telegram.org/bot" + token + "/" + method, data=b"{}", headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.load(response)
              if not data.get("ok"):
                  raise ValueError("API rejected request")
              return data["result"]
          try:
              me = api("getMe")
              if me.get("username", "").lower() != "revolismoto_bot":
                  print("FAIL: Token belongs to a different bot.")
                  sys.exit(1)
              print("PASS: Token accepted for @revolismoto_bot.")
              webhook = api("getWebhookInfo")
              if webhook.get("url"):
                  print("STOP: Existing webhook found; it was not changed.")
                  sys.exit(1)
              print("PASS: No webhook configured. No messages sent.")
              updates = api("getUpdates")
              matches = {(m["chat"]["id"], m.get("message_thread_id")) for u in updates for m in [u.get("message", {})] if m.get("text", "").strip() == "/setup@revolismoto_bot revolis-0411-topic" and m.get("chat", {}).get("type") == "supergroup" and m.get("chat", {}).get("title") == "Revolis.Мото (Общее)" and m.get("is_topic_message") and isinstance(m.get("message_thread_id"), int)}
              if len(matches) != 1:
                  print("FAIL: Expected exactly one matching group topic setup marker.")
                  sys.exit(1)
              print("PASS: Unique setup marker found in the requested group topic. IDs and messages not logged.")
          except Exception:
              print("FAIL: Telegram verification failed. Details suppressed to protect token.")
              sys.exit(1)
          PY
