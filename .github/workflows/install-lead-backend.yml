name: Install Telegram lead backend
# Notification format: local date and time without timezone label.
on:
  push:
    branches: [development]
    paths: ['.github/workflows/install-lead-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate backend
        run: |
          php -l server/leads.php
          php -l server/lead-validation.php
          php tests/server/leads.test.php
      - run: sudo apt-get update -qq && sudo apt-get install -y python3-paramiko
      - name: Update backend while preserving private configuration
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          /usr/bin/python3 - <<'PY'
          import os, socket, hashlib, base64, json, secrets, urllib.request, urllib.error, posixpath, pathlib, stat
          import paramiko
          t=s=None
          probe=marker=None
          stage="configuration"
          try:
              assert all(os.environ.get(n) for n in ("FTP_SERVER","FTP_USERNAME","FTP_PASSWORD","FTP_SERVER_DIR"))
              t=paramiko.Transport(socket.create_connection((os.environ["FTP_SERVER"],22),timeout=20))
              t.get_security_options().key_types=("ssh-ed25519",)
              t.start_client(timeout=20)
              assert "SHA256:"+base64.b64encode(hashlib.sha256(t.get_remote_server_key().asbytes()).digest()).decode().rstrip("=")=="SHA256:Yk1d+cp6318Dso8AHTwoCStX/iHcxGRXMSntQ++OSK4"
              t.auth_password(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"])
              s=paramiko.SFTPClient.from_transport(t)
              s.get_channel().settimeout(20)
              root=s.normalize(os.environ["FTP_SERVER_DIR"])
              assert posixpath.basename(root)=="revolis.by" and posixpath.basename(posixpath.dirname(root))=="www"
              private=posixpath.join(posixpath.dirname(posixpath.dirname(root)),"revolis-private")
              def exists(p):
                  try: return s.lstat(p)
                  except FileNotFoundError: return None
              def directory(p,mode):
                  info=exists(p)
                  if info: assert stat.S_ISDIR(info.st_mode)
                  else: s.mkdir(p,mode)
                  s.chmod(p,mode)
              def write(p,data,mode):
                  with s.open(p,"w") as f: f.write(data)
                  s.chmod(p,mode)
                  with s.open(p,"rb") as f: assert f.read()==data
              assert exists(private+"/leads.php"), "Existing private configuration required"
              directory(private,0o700)
              nonce=secrets.token_hex(16)
              marker=private+"/check-"+nonce
              write(marker,nonce.encode(),0o600)
              name="lead-check-"+nonce+".php"
              probe=root+"/"+name
              php="""<?php
          ini_set('display_errors','0');
          header('Content-Type: application/json'); header('Cache-Control: no-store');
          $p=dirname(__DIR__,2).'/revolis-private';
          $ok=is_readable($p.'/check-NONCE') && file_get_contents($p.'/check-NONCE')==='NONCE';
          echo json_encode(['php'=>PHP_VERSION_ID>=80000,'curl'=>function_exists('curl_init'),'path'=>$ok,'write'=>is_writable($p)]);
          """.replace("NONCE",nonce).encode()
              write(probe,php,0o644)
              stage="web PHP private access"
              with urllib.request.urlopen("https://revolis.by/"+name,timeout=30) as r: checks=json.loads(r.read(4096))
              assert all(checks.values())
              print("PASS: web PHP, cURL, private path, permissions.")
              rate=private+"/lead-rate-limit.json"
              if not exists(rate): write(rate,b"{}",0o600)
              else:
                  assert stat.S_ISREG(s.lstat(rate).st_mode)
                  s.chmod(rate,0o600)
              stage="backend"
              directory(root+"/api",0o755)
              for name in ("lead-validation.php","leads.php"):
                  data=pathlib.Path("server",name).read_bytes()
                  target=root+"/api/"+name
                  if exists(target):
                      assert stat.S_ISREG(s.lstat(target).st_mode)
                      with s.open(target,"rb") as f: previous=f.read()
                      if previous!=data: write(private+"/backup-"+nonce+"-"+name,previous,0o600)
                  write(target+".tmp",data,0o644)
                  s.posix_rename(target+".tmp",target)
              stage="HTTP rejection"
              try: urllib.request.urlopen("https://revolis.by/api/leads.php",timeout=30)
              except urllib.error.HTTPError as e:
                  assert e.code==405 and json.loads(e.read())=={"ok":False}
              else: raise ValueError("Expected 405")
              print("PASS: backend installed; GET safely rejected. Private configuration preserved; real form test still required.")
          except Exception as e:
              print("FAIL: "+stage+"; "+type(e).__name__+"; details hidden.")
              raise SystemExit(1)
          finally:
              if s:
                  for p in (probe,marker):
                      if p and exists(p): s.remove(p)
              if t: t.close()
          PY
