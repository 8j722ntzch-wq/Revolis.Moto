name: Deploy to hoster.by

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate deployment secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret is missing: $name"
              exit 1
            fi
          done
          if [[ "$FTP_SERVER_DIR" != */ ]]; then
            echo '::error::FTP_SERVER_DIR must end with /'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check project
        run: |
          npm run check
          npm run design:check
          npm test
          python3 -m unittest discover -s tests/deploy -v

      - name: Build static website
        run: |
          npm run build:release
          test -s dist/index.html

      - name: Install SFTP client
        run: sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq && sudo apt-get install -y python3-paramiko
      - name: Back up and publish master over SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: /usr/bin/python3 -u scripts/deploy-hoster.py
      - name: Verify public homepage
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, urllib.request
          url = "https://revolis.by/?deploy=" + os.environ["GITHUB_SHA"]
          request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
          with urllib.request.urlopen(request, timeout=30) as response:
              received = response.read()
              assert response.status == 200, "Unexpected HTTP status"
              assert hashlib.sha256(received).digest() == hashlib.sha256(pathlib.Path("dist/index.html").read_bytes()).digest(), "Public homepage differs from this build"
              assert "no-cache" in response.headers.get("Cache-Control", ""), "Host must enable HTML cache revalidation"
          print("PASS: HTTPS homepage matches this master build and revalidates cache.")
          PY
