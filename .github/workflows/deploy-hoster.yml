name: Deploy to hoster.by

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate deployment secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret is missing: $name"
              exit 1
            fi
          done
          if [[ "$FTP_SERVER_DIR" != */ ]]; then
            echo '::error::FTP_SERVER_DIR must end with /'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check project
        run: |
          npm run check
          npm run design:check
          npm test
          python3 -m unittest discover -s tests/deploy -v

      - name: Build static website
        env:
          PUBLIC_PERSONAL_DATA_POLICY_URL: /documents/personal-data-policy-2026-11-04.pdf
        run: |
          npm run build:release
          test -s dist/index.html

      - name: Install SFTP client
        run: sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq && sudo apt-get install -y python3-paramiko
      - name: Back up and publish master over SFTP
        id: upload
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: /usr/bin/python3 -u scripts/deploy-hoster.py
      - name: Verify public homepage
        id: homepage
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, urllib.request
          url = "https://revolis.by/?deploy=" + os.environ["GITHUB_SHA"]
          request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
          with urllib.request.urlopen(request, timeout=30) as response:
              received = response.read()
              assert response.status == 200, "Unexpected HTTP status"
              assert hashlib.sha256(received).digest() == hashlib.sha256(pathlib.Path("dist/index.html").read_bytes()).digest(), "Public homepage differs from this build"
              pathlib.Path(os.environ["RUNNER_TEMP"], "revolis-cache-control.txt").write_text(response.headers.get("Cache-Control", ""))
          print("PASS: HTTPS homepage matches this master build.")
          PY
      - name: Check HTML cache policy
        id: cache
        if: steps.homepage.outcome == 'success'
        run: |
          python3 - <<'PY'
          import os, pathlib
          header = pathlib.Path(os.environ["RUNNER_TEMP"], "revolis-cache-control.txt").read_text()
          directives = {part.strip().lower() for part in header.split(",")}
          valid = "no-cache" in directives
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("policy=" + ("passed" if valid else "warning") + "\n")
          if valid:
              print("PASS: HTML cache revalidation is enabled.")
          else:
              print("::warning title=HTML cache policy::Publication succeeded, but hoster.by must enable Cache-Control: no-cache for HTML.")
          PY
      - name: Deployment report
        if: always()
        env:
          UPLOAD_RESULT: ${{ steps.upload.outcome }}
          HOMEPAGE_RESULT: ${{ steps.homepage.outcome }}
          CACHE_RESULT: ${{ steps.cache.outputs.policy }}
        run: |
          python3 - <<'PY'
          import os
          upload = "Успешно — файлы опубликованы и проверены" if os.environ["UPLOAD_RESULT"] == "success" else "Не подтверждена — см. журнал публикации"
          homepage = "Успешно — HTTPS 200, содержимое совпадает со сборкой" if os.environ["HOMEPAGE_RESULT"] == "success" else "Не подтверждена — см. журнал проверки"
          cache = {"passed": "Успешно — no-cache включён", "warning": "Предупреждение — настройте no-cache для HTML на hoster.by"}.get(os.environ["CACHE_RESULT"], "Не проверен")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Публикация на hoster.by\n\n| Этап | Результат |\n| --- | --- |\n")
              for name, result in [("Загрузка файлов", upload), ("Публичная главная", homepage), ("Кэш HTML", cache)]:
                  summary.write(f"| {name} | {result} |\n")
          PY
