name: Check hoster.by SFTP port 22 (read only)
on:
  push:
    branches: [development]
    paths: ['.github/workflows/check-hoster-ssh.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-sftp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install SFTP client
        run: sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq && sudo apt-get install -y python3-paramiko
      - name: Verify pinned server key and SFTP login
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          /usr/bin/python3 - <<'PY'
          import os, socket, hashlib, base64, sys
          import paramiko
          stage = "configuration"
          transport = None
          try:
              host, user, password, directory = [os.environ[n] for n in ("FTP_SERVER", "FTP_USERNAME", "FTP_PASSWORD", "FTP_SERVER_DIR")]
              if not all((host, user, password, directory)):
                  raise ValueError("Missing secret")
              stage = "SSH connection on port 22"
              sock = socket.create_connection((host, 22), timeout=20)
              transport = paramiko.Transport(sock)
              transport.get_security_options().key_types = ("ssh-ed25519",)
              transport.start_client(timeout=20)
              stage = "server fingerprint verification"
              fingerprint = "SHA256:" + base64.b64encode(hashlib.sha256(transport.get_remote_server_key().asbytes()).digest()).decode().rstrip("=")
              if fingerprint != "SHA256:Yk1d+cp6318Dso8AHTwoCStX/iHcxGRXMSntQ++OSK4":
                  raise ValueError("Host key mismatch")
              print("PASS: Confirmed ED25519 server key matches.", flush=True)
              stage = "password authentication"
              transport.auth_timeout = 20
              transport.auth_password(user, password)
              print("PASS: SFTP credentials accepted.", flush=True)
              stage = "SFTP subsystem"
              sftp = paramiko.SFTPClient.from_transport(transport)
              sftp.get_channel().settimeout(20)
              stage = "configured directory access"
              for candidate in (".", "www/revolis.by", "/www/revolis.by", "revolis.by"):
                  try:
                      names = sftp.listdir(candidate)
                      print("DIRECTORY " + candidate + ": accessible; index.html=" + str("index.html" in names) + "; index.php=" + str("index.php" in names) + "; www=" + str("www" in names), flush=True)
                  except OSError:
                      print("DIRECTORY " + candidate + ": unavailable", flush=True)
              sftp.chdir(directory)
              sftp.listdir(".")
              print("PASS: SFTP directory is accessible. No files changed.", flush=True)
              sftp.close()
          except Exception as error:
              print("FAIL: " + stage + "; " + type(error).__name__ + ". Details hidden to protect secrets.", flush=True)
              sys.exit(1)
          finally:
              if transport:
                  transport.close()
          PY
